<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Login — UTS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: #0a0f1a;
            overflow: hidden;
        }

        /* Fondo con imagen UTS */
        .bg-image {
            position: fixed;
            inset: 0;
            background: url('/images/uts-fondo.jpg') center center / cover no-repeat;
            filter: brightness(0.35) saturate(0.8);
            z-index: 0;
            transform: scale(1.05);
            animation: slowZoom 20s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1.05); }
            to   { transform: scale(1.12); }
        } 	

        /* Overlay degradado verde UTS */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 80, 30, 0.55) 0%,
                rgba(10, 15, 26, 0.75) 60%,
                rgba(10, 15, 26, 0.95) 100%
            );
            z-index: 1;
        }

        /* Línea decorativa verde UTS */
        .accent-bar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 5px;
            background: linear-gradient(to bottom, #4ade80, #16a34a, #052e16);
            z-index: 2;
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 16px;
            animation: fadeUp .6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-login {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(74, 222, 128, 0.18);
            border-radius: 20px;
            padding: 48px 44px;
            box-shadow:
                0 0 0 1px rgba(74,222,128,0.06),
                0 32px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* Logo */
        .logo-wrap {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #16a34a, #4ade80);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(74,222,128,0.3);
        }
        .logo-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }
        .logo-sub {
            font-size: .8rem;
            color: #64748b;
            letter-spacing: .5px;
            margin-top: 4px;
        }

        /* Inputs */
        .form-label {
            color: #94a3b8;
            font-size: .8rem;
            font-weight: 500;
            letter-spacing: .5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .form-control {
            background: rgba(255,255,255,0.04) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 10px !important;
            color: #f1f5f9 !important;
            padding: 12px 16px !important;
            font-size: .95rem;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: rgba(74,222,128,0.5) !important;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.12) !important;
            background: rgba(255,255,255,0.07) !important;
        }
        .form-control::placeholder { color: #475569 !important; }

        /* Botón principal */
        .btn-ingresar {
            background: linear-gradient(135deg, #16a34a, #4ade80);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 13px;
            width: 100%;
            letter-spacing: .5px;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 20px rgba(74,222,128,0.3);
            margin-top: 8px;
        }
        .btn-ingresar:hover {
            opacity: .9;
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(74,222,128,0.4);
        }
        .btn-ingresar:active { transform: translateY(0); }

        /* Botón secundario prueba */
        .btn-prueba {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #94a3b8;
            font-size: .85rem;
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            transition: background .2s, color .2s;
        }
        .btn-prueba:hover {
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }
        .divider span { color: #475569; font-size: .75rem; }

        /* Link estudiante */
        .student-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #4ade80;
            text-decoration: none;
            font-size: .875rem;
            font-weight: 500;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(74,222,128,0.2);
            transition: background .2s;
        }
        .student-link:hover {
            background: rgba(74,222,128,0.08);
            color: #4ade80;
        }

        /* Alert */
        .alert-danger {
            background: rgba(239,68,68,0.12) !important;
            border: 1px solid rgba(239,68,68,0.3) !important;
            color: #fca5a5 !important;
            border-radius: 10px;
            font-size: .875rem;
            padding: 10px 14px;
        }

        /* Modal */
        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(74,222,128,0.2);
            border-radius: 16px;
        }
        .modal-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
        .modal-footer { border-top: 1px solid rgba(255,255,255,0.08); }
        .table-dark { --bs-table-bg: transparent; }
        .badge-rol {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: .75rem;
        }

        /* Watermark UTS bottom */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 24px;
            z-index: 5;
            color: rgba(255,255,255,0.2);
            font-family: 'Rajdhani', sans-serif;
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>
<div class="accent-bar"></div>

<div class="wrap">
    <div class="card-login">

        <div class="logo-wrap">
            <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="logo-title">UTS</div>
            <div class="logo-sub">Unidades Tecnológicas de Santander</div>
            <div class="logo-sub mt-1">Sistema de Gestión · Saber Pro / TyT</div>
        </div>

        <div th:if="${error}" class="alert alert-danger mb-4">
            <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo institucional</label>
                <input type="email" name="correo" class="form-control"
                       placeholder="correo@uts.edu.co" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-ingresar">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema
            </button>
            <button type="button" class="btn-prueba"
                    data-bs-toggle="modal" data-bs-target="#usuariosModal">
                <i class="bi bi-people-fill me-1"></i>Ver usuarios de prueba
            </button>
        </form>

        <div class="divider"><span>Portal Estudiantil</span></div>

        <a th:href="@{/estudiante/login}" class="student-link">
            <i class="bi bi-person-fill"></i>
            ¿Eres estudiante? Ingresa aquí
        </a>
    </div>
</div>

<div class="watermark">UTS · Bucaramanga</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Modal Usuarios -->
<div class="modal fade" id="usuariosModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content text-white">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">
            <i class="bi bi-shield-lock me-2 text-success"></i>Usuarios del Sistema
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert py-2 mb-3" style="background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);color:#4ade80;border-radius:10px">
          <i class="bi bi-key me-1"></i>Contraseña de todos los usuarios de prueba: <strong>123</strong>
        </div>
        <div class="table-responsive">
        <table class="table table-dark table-sm align-middle mb-0">
          <thead style="color:#64748b;font-size:.8rem;text-transform:uppercase">
            <tr><th>Nombre</th><th>Email</th><th>Cédula</th><th>Rol</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.nombre} + ' ' + ${u.apellido}"></td>
              <td class="text-muted small" th:text="${u.correo}"></td>
              <td th:text="${u.cedula}"></td>
              <td><span class="badge-rol" th:text="${u.rol}"></span></td>
              <td>
				<button class="btn btn-sm btn-success fw-bold"
				        th:attr="onclick=|document.querySelector('input[name=correo]').value='${u.correo}';
				                 document.querySelector('input[name=contrasena]').value='${u.contrasena}';
				                 bootstrap.Modal.getInstance(document.getElementById('usuariosModal')).hide();|">
				    Usar
				</button>
              </td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
