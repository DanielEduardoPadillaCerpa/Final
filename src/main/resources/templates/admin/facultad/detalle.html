<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detalle Facultad — ' + ${facultad.nombre}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="bi bi-building me-2"></i>
            <span th:text="${facultad.nombre}"></span>
        </div>
        <div class="card-body">
            <p class="text-muted" th:text="${facultad.descripcion}"></p>
            <span th:if="${facultad.activo}" class="badge bg-success">Activa</span>
            <span th:if="${!facultad.activo}" class="badge bg-danger">Inactiva</span>

            <hr>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">Programas Académicos</h5>
                <a th:href="@{/admin/facultades/{id}/programas/nuevo(id=${facultad.id})}"
                   class="btn btn-sm btn-success">
                   <i class="bi bi-plus-circle me-1"></i> Nuevo Programa
                </a>
            </div>

            <table class="table table-hover table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Tipo Examen</th>
                    <th>Activo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prog : ${facultad.programas}">
                    <td th:text="${prog.nombre}"></td>
                    <td th:text="${prog.tipoExamen}"></td>
                    <td>
                        <span th:if="${prog.activo}" class="badge bg-success">Sí</span>
                        <span th:if="${!prog.activo}" class="badge bg-danger">No</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/admin/facultades}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver
