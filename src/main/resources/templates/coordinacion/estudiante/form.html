<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Estudiante</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/coordinacion/dashboard}">UTS — Coordinación</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/coordinacion/estudiantes}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>
<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">
            <i class="bi bi-person-plus me-1"></i>
            <span th:text="${estudiante.id != null} ? 'Editar Estudiante' : 'Nuevo Estudiante'"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/coordinacion/estudiantes/guardar}" th:object="${estudiante}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tipo Documento</label>
                        <select th:field="*{tipoDocumento}" class="form-select">
                            <option th:each="t : ${tiposDoc}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Cédula / Documento</label>
                        <input type="text" th:field="*{cedula}" class="form-control"
                               th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cedula}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Primer Nombre</label>
                        <input type="text" th:field="*{primerNombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('primerNombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{primerNombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Segundo Nombre</label>
                        <input type="text" th:field="*{segundoNombre}" class="form-control" placeholder="Opcional">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Primer Apellido</label>
                        <input type="text" th:field="*{primerApellido}" class="form-control"
                               th:classappend="${#fields.hasErrors('primerApellido')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{primerApellido}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Segundo Apellido</label>
                        <input type="text" th:field="*{segundoApellido}" class="form-control" placeholder="Opcional">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control"
                               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{correo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Programa Académico</label>
                        <select th:field="*{programa}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="p : ${programas}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre + ' (' + p.tipoExamen + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Examen</label>
                        <select th:field="*{tipoExamen}" class="form-select">
                            <option th:each="t : ${tiposExamen}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold">
                        <i class="bi bi-floppy me-1"></i>
                        <span th:text="${estudiante.id != null} ? 'Actualizar' : 'Registrar'"></span>
                    </button>
                    <a th:href="@{/coordinacion/estudiantes}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
