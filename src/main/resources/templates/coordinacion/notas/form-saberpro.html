<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Notas Saber Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-light" th:href="@{/coordinacion/dashboard}">UTS — Coordinación</a>
        <a class="btn btn-outline-light btn-sm"
           th:href="@{/coordinacion/estudiantes/detalle/{id}(id=${estudiante.id})}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>

<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-light fw-bold">
            <i class="bi bi-award me-1"></i>Resultados Saber Pro —
            <span th:text="${estudiante.getNombreCompleto()}"></span>
        </div>
        <div class="card-body">
            <!-- Usa 'resultado' porque así lo envía el controlador -->
            <form th:action="@{/coordinacion/notas/pro/guardar}" th:object="${resultado}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="estudiante.id" th:value="${estudiante.id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">N° Registro</label>
                        <input type="text" th:field="*{numeroRegistro}" class="form-control" placeholder="EK2026...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold text-white">Puntaje Global</label>
                        <input type="number" th:field="*{puntajeGlobal}" class="form-control text-white" min="0" max="300">
                    </div>
                </div>

                <hr><p class="fw-semibold text-muted mb-2">Competencias</p>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small">Comunicación Escrita</label>
                        <input type="number" th:field="*{comunicacionEscrita}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Razonamiento Cuantitativo</label>
                        <input type="number" th:field="*{razonamientoCuantitativo}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small">Lectura Crítica</label>
                        <input type="number" th:field="*{lecturaCritica}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Formulación de Proyectos de Ingeniería</label>
                        <input type="number" th:field="*{formulacionProyectosIngenieria}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small">Diseño de Software</label>
                        <input type="number" th:field="*{disenoSoftware}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{anulado}" class="form-check-input" id="anulado">
                            <label class="form-check-label text-danger fw-semibold" for="anulado">Anular examen</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold">
                        <i class="bi bi-floppy me-1"></i>Guardar Resultados
                    </button>
                    <a th:href="@{/coordinacion/estudiantes/detalle/{id}(id=${estudiante.id})}"
                       class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
