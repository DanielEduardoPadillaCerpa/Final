<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Pagos Saber Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/coordinacion/dashboard}">UTS — Coordinación</a>
		<a class="btn btn-outline-dark btn-sm" th:href="@{/coordinacion/dashboard}">
							            <i class="bi bi-arrow-left me-1"></i>Volver
							        </a>
    </div>
	
</nav>
<div class="container-fluid px-4">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">
            <i class="bi bi-credit-card me-1"></i>Comprobantes de Pago Saber Pro
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(pagos)}" class="p-4 text-center text-muted">
                No hay comprobantes registrados.
            </div>
            <table th:unless="${#lists.isEmpty(pagos)}" class="table table-hover table-bordered mb-0">
                <thead class="table-light">
                    <tr><th>Estudiante</th><th>Cédula</th><th>Archivo</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pagos}">
                        <td th:text="${p.estudiante.getNombreCompleto()}"></td>
                        <td th:text="${p.estudiante.cedula}"></td>
						<td>
						    <i class="bi bi-file-earmark-pdf text-danger me-1"></i>
						    <a th:href="@{'/estudiante/pago/ver/' + ${p.nombreArchivo}}" 
						       target="_blank" 
						       th:text="${p.nombreArchivo}"></a>
						</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${p.estado.name() == 'VERIFICADO'} ? 'bg-success' : (${p.estado.name() == 'RECHAZADO'} ? 'bg-danger' : 'bg-warning text-dark')"
                                  th:text="${p.estado}"></span>
                        </td>
                        <td th:if="${p.estado.name() == 'PENDIENTE'}">
                            <a th:href="@{/coordinacion/pagos/verificar/{id}(id=${p.id},estado='VERIFICADO')}"
                               class="btn btn-sm btn-success me-1">
                                <i class="bi bi-check-circle me-1"></i>Verificar
                            </a>
                            <a th:href="@{/coordinacion/pagos/verificar/{id}(id=${p.id},estado='RECHAZADO')}"
                               class="btn btn-sm btn-danger">
                                <i class="bi bi-x-circle me-1"></i>Rechazar
                            </a>
                        </td>
                        <td th:unless="${p.estado.name() == 'PENDIENTE'}" class="text-muted small">
                            <span th:text="${p.fechaVerificacion}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
