<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Notas TyT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-info mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-dark" th:href="@{/coordinacion/dashboard}">UTS — Coordinación</a>
        <a class="btn btn-outline-dark btn-sm"
           th:href="@{/coordinacion/estudiantes/detalle/{id}(id=${estudiante.id})}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>
<div class="container"><div class="row justify-content-center"><div class="col-md-8">
    <div class="card shadow-sm">
        <div class="card-header bg-info text-dark fw-bold">
            <i class="bi bi-clipboard-data me-1"></i>Resultados Saber TyT —
            <span th:text="${estudiante.getNombreCompleto()}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/coordinacion/notas/tyt/guardar}" th:object="${resultado}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="estudiante.id" th:value="${estudiante.id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">N° Registro</label>
                        <input type="text" th:field="*{numeroRegistro}" class="form-control" placeholder="EK20183...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Puntaje Global</label>
                        <input type="number" th:field="*{puntajeGlobal}" class="form-control" min="0" max="300">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Nivel Global</label>
                        <select th:field="*{nivelGlobal}" class="form-select">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                </div>

                <hr><p class="fw-semibold text-muted mb-2">Competencias</p>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small">Comunicación Escrita</label>
                        <input type="number" step="0.01" th:field="*{comunicacionEscrita}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Nivel</label>
                        <select th:field="*{comunicacionEscritaNivel}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Razonamiento Cuantitativo</label>
                        <input type="number" step="0.01" th:field="*{razonamientoCuantitativo}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Nivel</label>
                        <select th:field="*{razonCuantNivel}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small">Lectura Crítica</label>
                        <input type="number" step="0.01" th:field="*{lecturaCritica}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Nivel</label>
                        <select th:field="*{lecturaCriticaNivel}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Competencias Ciudadanas</label>
                        <input type="number" step="0.01" th:field="*{competenciasCiudadanas}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Nivel</label>
                        <select th:field="*{compCiudadanasNivel}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label small">Inglés</label>
                        <input type="number" step="0.01" th:field="*{ingles}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Nivel</label>
                        <select th:field="*{inglesNivel}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel 1">Nivel 1</option><option value="Nivel 2">Nivel 2</option>
                            <option value="Nivel 3">Nivel 3</option><option value="Nivel 4">Nivel 4</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Certificado Inglés</label>
                        <select th:field="*{nivelInglesCertificado}" class="form-select form-select-sm">
                            <option value="">--</option>
                            <option value="Nivel A0">A0</option><option value="Nivel A1">A1</option><option value="Nivel A2">A2</option>
                            <option value="Nivel B1">B1</option><option value="Nivel B2">B2</option><option value="Nivel C1">C1</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{anulado}" class="form-check-input" id="anulado">
                            <label class="form-check-label text-danger fw-semibold" for="anulado">Anular examen</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-info text-dark fw-semibold">
                        <i class="bi bi-floppy me-1"></i>Guardar Resultados
                    </button>
                    <a th:href="@{/coordinacion/estudiantes/detalle/{id}(id=${estudiante.id})}"
                       class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
