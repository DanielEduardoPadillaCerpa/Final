<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Buscar por Facultad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body{background:#f1f5f9} .section-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 8px rgba(0,0,0,.08)}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/docente/dashboard}">UTS — Docente</a>
        <a th:href="@{/docente/dashboard}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>
<div class="container pb-5">
    <div class="section-card mb-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-building me-1 text-success"></i>Buscar Estudiantes por Facultad</h6>
        <form th:action="@{/docente/consulta/por-facultad/buscar}" method="get" class="d-flex gap-2">
            <select name="facultadId" class="form-select" required>
                <option value="">— Seleccione una facultad —</option>
                <option th:each="f : ${facultades}"
                        th:value="${f.id}"
                        th:text="${f.nombre}"
                        th:selected="${f.id == facultadId}">
                </option>
            </select>
            <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-search"></i>
            </button>
        </form>
    </div>

    <!-- Tabla de resultados -->
    <div th:if="${estudiantes != null}" class="section-card">
        <h6 class="fw-bold mb-3">
            Estudiantes encontrados:
            <span class="badge bg-success" th:text="${#lists.size(estudiantes)}"></span>
        </h6>
        <div th:if="${#lists.isEmpty(estudiantes)}" class="text-muted">
            <i class="bi bi-inbox me-1"></i>No hay estudiantes en esta facultad.
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(estudiantes)}">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre completo</th>
                        <th>Programa</th>
                        <th>Tipo examen</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="est : ${estudiantes}">
                        <td th:text="${est.cedula}"></td>
                        <td class="fw-semibold" th:text="${est.getNombreCompleto()}"></td>
                        <td th:text="${est.programa != null} ? ${est.programa.nombre} : '—'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${est.tipoExamen.name() == 'TYT'} ? 'bg-info text-dark' : 'bg-primary'"
                                  th:text="${est.tipoExamen}"></span>
                        </td>
                        <td>
                            <a th:href="@{/docente/consulta/detalle/{id}(id=${est.id})}"
                               class="btn btn-sm btn-success">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
