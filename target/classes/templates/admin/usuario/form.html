<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">UTS — Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/usuarios}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>
<div class="container"><div class="row justify-content-center"><div class="col-md-7">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">
            <i class="bi bi-person-plus me-1"></i>
            <span th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cédula</label>
                        <input type="text" th:field="*{cedula}" class="form-control"
                               th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cedula}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control"
                               th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{apellido}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo</label>
                    <input type="email" th:field="*{correo}" class="form-control"
                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{correo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control"
                           placeholder="Dejar vacío para no cambiar">
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Rol</label>
                        <select th:field="*{rol}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Facultad</label>
                        <select th:field="*{facultad}" class="form-select">
                            <option value="">-- Global (Admin) --</option>
                            <option th:each="f : ${facultades}"
                                    th:value="${f.id}"
                                    th:text="${f.nombre}"></option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold">
                        <i class="bi bi-floppy me-1"></i>
                        <span th:text="${usuario.id != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
