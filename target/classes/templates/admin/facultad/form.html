<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Facultad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-warning mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-dark" th:href="@{/admin/dashboard}">UTS — Admin</a>
        <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/facultades}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>
<div class="container"><div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="bi bi-building me-1"></i>
            <span th:text="${facultad.id != null} ? 'Editar Facultad' : 'Nueva Facultad'"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/facultades/guardar}" th:object="${facultad}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                           placeholder="Ej: Facultad de Tecnología e Ingeniería">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"
                              placeholder="Descripción opcional"></textarea>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activo">
                    <label class="form-check-label" for="activo">Activa</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning text-dark fw-semibold">
                        <i class="bi bi-floppy me-1"></i>
                        <span th:text="${facultad.id != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                    <a th:href="@{/admin/facultades}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
