<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Facultades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-warning mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-dark" th:href="@{/admin/dashboard}">UTS — Admin</a>
		<div class="d-flex gap-2">
			<a class="btn btn-outline-dark btn-sm" th:href="@{/admin/facultades/nuevo}">
			            <i class="bi bi-plus-circle me-1"></i>Nueva
			        </a>
					<a class="btn btn-outline-dark btn-sm" th:href="@{/admin/dashboard}">
						<i class="bi bi-arrow-left me-1"></i>Volver
					</a>
		</div>
    </div>
</nav>
<div class="container">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="bi bi-building me-1"></i>Facultades
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-light">
                    <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${facultades}">
                        <td th:text="${f.id}"></td>
                        <td class="fw-semibold" th:text="${f.nombre}"></td>
                        <td class="text-muted small" th:text="${f.descripcion}"></td>
                        <td>
                            <span th:if="${f.activo}" class="badge bg-success">Activa</span>
                            <span th:unless="${f.activo}" class="badge bg-secondary">Inactiva</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/facultades/editar/{id}(id=${f.id})}" class="btn btn-sm btn-warning me-1">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <a th:href="@{/admin/facultades/eliminar/{id}(id=${f.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar?')">
                                <i class="bi bi-trash-fill"></i>
                            </a>
							<a th:href="@{/admin/facultades/{id}(id=${f.id})}" 
							   class="btn btn-sm btn-info me-1">
							   <i class="bi bi-eye"></i>
							</a>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
