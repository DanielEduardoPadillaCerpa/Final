<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Programa Académico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white fw-bold">
            <i class="bi bi-journal-plus me-2"></i>
            <span th:text="'Nuevo Programa en ' + ${facultad.nombre}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/facultades/{id}/programas/guardar(id=${facultad.id})}"
                  th:object="${programa}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tipo de Examen</label>
                    <select th:field="*{tipoExamen}" class="form-select" required>
                        <option value="TYT">TYT</option>
                        <option value="SABER_PRO">Saber Pro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
                    <label class="form-check-label" for="activo">Activo</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success fw-semibold">
                        <i class="bi bi-floppy me-1"></i> Guardar
                    </button>
                    <a th:href="@{/admin/facultades/{id}(id=${facultad.id})}" class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
