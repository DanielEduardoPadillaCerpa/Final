<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subir Comprobante</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>body{background:#f1f5f9}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/estudiante/dashboard}">Portal Estudiante</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/estudiante/dashboard}">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark fw-bold">
                    <i class="bi bi-credit-card me-1"></i>Subir Comprobante de Pago
                </div>
                <div class="card-body">

                    <!-- Mostrar estado si ya hay comprobante -->
                    <div th:if="${pago != null}" class="alert alert-info mb-3">
                        <i class="bi bi-info-circle me-1"></i>
                        Ya tienes un comprobante subido:
                        <strong>
                            <a th:href="@{'/estudiante/pago/ver/' + ${pago.nombreArchivo}}" 
                               target="_blank" 
                               th:text="${pago.nombreArchivo}"></a>
                        </strong>
                        (Estado: <span th:text="${pago.estado}"></span>)
                    </div>

                    <!-- Formulario para subir/actualizar comprobante -->
                    <form th:action="@{/estudiante/pago/subir}" 
                          method="post" 
                          enctype="multipart/form-data">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Selecciona el archivo (PDF o imagen)</label>
                            <input type="file" name="archivo" class="form-control"
                                   accept=".pdf,.jpg,.jpeg,.png" required>
                            <div class="form-text text-muted">Formatos: PDF, JPG, PNG. Máximo 5MB.</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-dark fw-semibold">
                                <i class="bi bi-upload me-1"></i>
                                <span th:if="${pago == null}">Subir Comprobante</span>
                                <span th:unless="${pago == null}">Actualizar Comprobante</span>
                            </button>
                            <a th:href="@{/estudiante/dashboard}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
